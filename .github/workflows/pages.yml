# Build the WASM + WebGPU bundles and publish the demo to GitHub Pages.
#
# What ends up on Pages is only the page: HTML, JS, CSS and the two wasm
# bundles (~16 MB each). The model deliberately does not, and cannot —
# GitHub rejects any single file over 100 MB and caps a Pages site at
# 1 GB, while `model.safetensors` is 4.37 GB. The page streams it
# cross-origin from Hugging Face instead, which serves HTTP Range requests
# with `Access-Control-Allow-Origin` and exposes `Content-Range`.
#
# The exception is `audiovae.safetensors`. Upstream publishes only
# `audiovae.pth`, a Python pickle the browser build cannot read, and no
# safetensors version is hosted anywhere public — so this workflow
# converts it here and ships the 359 MB result *with the site*. That is
# what makes the demo self-contained: a visitor opens the URL and nothing
# else is required of them.
#
# VoxCPM2 is Apache-2.0 and not gated, so redistributing the converted
# weights is permitted; the licence is shipped alongside them.
#
# Budget: ~359 MB (AudioVAE) + ~23 MB (two wasm bundles) is well inside
# the 1 GB Pages site limit. Pages' ~100 GB/month soft bandwidth cap
# works out to roughly 250 full loads; the 4.4 GB checkpoint comes from
# Hugging Face, not from here.
name: Deploy demo to Pages

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'web/**'
      - 'vendor/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - 'scripts/build-web.sh'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a newer push supersede an in-flight build, but never interrupt a
# deployment half-way.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # `Cargo.toml` sets lto = "fat" + codegen-units = 1, which is the right
  # trade for a shipped binary and far too slow on a 2-core runner. Thin
  # LTO costs a little size and saves a lot of wall clock.
  CARGO_PROFILE_RELEASE_LTO: thin
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust with the wasm target
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add wasm32-unknown-unknown
          rustc --version

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2
        with:
          key: wasm32-pages
          cache-targets: 'true'

      - name: Install wasm-bindgen-cli matching Cargo.lock
        run: |
          set -euo pipefail
          WANT=$(awk '
            /^name = "wasm-bindgen"$/ { f=1; next }
            f && /^version = / { gsub(/[":]/,""); print $3; exit }
          ' Cargo.lock)
          echo "wasm-bindgen crate version: $WANT"
          # A version mismatch between the CLI and the crate produces
          # broken glue, so this is pinned rather than "latest".
          URL="https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${WANT}/wasm-bindgen-${WANT}-x86_64-unknown-linux-musl.tar.gz"
          if curl -sSfL "$URL" -o wb.tar.gz; then
            tar xzf wb.tar.gz
            install -Dm755 "wasm-bindgen-${WANT}-x86_64-unknown-linux-musl/wasm-bindgen" "$HOME/.cargo/bin/wasm-bindgen"
          else
            echo "no prebuilt binary for $WANT; building from source"
            cargo install wasm-bindgen-cli --version "$WANT" --locked
          fi
          wasm-bindgen --version

      - name: Install binaryen
        # Pinned, not apt's. The version Ubuntu ships rebinds this
        # module's `__wbindgen_externrefs` export to the funcref table,
        # which cannot grow, so every page load dies with
        # "WebAssembly.Table.grow(): failed to grow table by 4". 123 is
        # verified good; `scripts/check-wasm.mjs` catches it either way.
        run: |
          set -euo pipefail
          V=123
          URL="https://github.com/WebAssembly/binaryen/releases/download/version_${V}/binaryen-version_${V}-x86_64-linux.tar.gz"
          curl -sSfL "$URL" -o binaryen.tar.gz
          tar xzf binaryen.tar.gz
          echo "$PWD/binaryen-version_${V}/bin" >> "$GITHUB_PATH"
          "$PWD/binaryen-version_${V}/bin/wasm-opt" --version

      - name: Build both precision bundles
        # `build-web.sh` smoke-tests each bundle with
        # scripts/check-wasm.mjs and fails here rather than deploying
        # something that cannot start.
        run: scripts/build-web.sh --both

      - name: Convert the AudioVAE and ship it with the site
        # Upstream has only the pickle. Converting it here is what lets a
        # visitor just open the page.
        #
        # Allowed to fail: it depends on Hugging Face being reachable, and
        # a network hiccup should not also throw away the wasm build. If
        # it does fail the site still deploys, the page detects the
        # missing file and asks the visitor for one, and the warning below
        # says what happened.
        id: audiovae
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p ckpt
          echo "downloading audiovae.pth"
          curl -sSfL --retry 3 \
            -o ckpt/audiovae.pth \
            "https://huggingface.co/openbmb/VoxCPM2/resolve/main/audiovae.pth"
          ls -l ckpt/audiovae.pth
          cargo run --release --example convert_audiovae \
            --no-default-features --features cpu -- ckpt
          ls -l ckpt/audiovae.safetensors

      - name: Warn if the AudioVAE is missing
        if: steps.audiovae.outcome != 'success'
        run: |
          echo "::warning title=AudioVAE missing::Converting audiovae.pth failed, \
          so the deployed page will not be self-contained: visitors will be asked \
          to supply audiovae.safetensors themselves. Re-run this workflow once \
          Hugging Face is reachable."

      - name: Assemble the site
        run: |
          set -euo pipefail
          mkdir -p site
          cp -r web/index.html web/main.js web/style.css web/favicon.svg \
                web/pkg web/pkg-f16 site/
          if [ -f ckpt/audiovae.safetensors ]; then
            cp ckpt/audiovae.safetensors site/
            # Apache-2.0 requires the licence to travel with redistributed
            # material, and these are VoxCPM2's weights.
            cp LICENSE site/MODEL-LICENSE.txt
          cat > site/MODEL-NOTICE.txt <<'NOTICE'
          audiovae.safetensors in this directory is a format conversion of
          audiovae.pth from https://huggingface.co/openbmb/VoxCPM2
          (VoxCPM2 by OpenBMB, Apache-2.0). Tensor names, shapes and dtypes
          are unchanged; only the container format differs, because the
          browser build cannot read a Python pickle. See MODEL-LICENSE.txt.
          NOTICE
          else
            echo "WARNING: no audiovae.safetensors — the page will ask for one" >&2
          fi
          # Pages runs Jekyll by default, which would skip paths it does
          # not like. This turns that off.
          touch site/.nojekyll
          echo "--- site contents ---"
          find site -type f | sort
          echo "--- total ---"
          du -sh site

      # Always keep the *expensive* part of the build retrievable, whether
      # or not Pages is set up: a one-time repository setting should not
      # cost you the compile above. The AudioVAE is excluded on purpose —
      # it is 359 MB and a one-minute conversion, so storing a second copy
      # of it on every run buys nothing.
      - name: Upload the site as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: |
            site
            !site/audiovae.safetensors
          retention-days: 14

      - id: pages
        uses: actions/configure-pages@v5
        # `enablement` only works when the repository already permits
        # Actions to create the Pages site. On a repo where Pages has
        # never been configured this usually fails, so it must not take
        # the whole build down with it.
        continue-on-error: true
        with:
          enablement: true

      - name: Explain how to finish enabling Pages
        if: steps.pages.outcome != 'success'
        run: |
          echo "::warning title=Pages not enabled::The site built fine and is \
          attached to this run as the 'site' artifact, but it was not deployed: \
          GitHub Pages has never been configured for this repository and the \
          workflow token is not allowed to turn it on. Enable it once under \
          Settings -> Pages -> Build and deployment -> Source: GitHub Actions, \
          then re-run this workflow."

      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outcome == 'success'
        with:
          path: site

    outputs:
      pages_ready: ${{ steps.pages.outcome }}

  deploy:
    needs: build
    # Skipped, rather than failed, when Pages is not set up yet.
    if: needs.build.outputs.pages_ready == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
